spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-payment}:${DB_PORT:5433}/${DB_NAME:payment_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:changeit}@${EUREKA_HOST:eureka-server}:8761/eureka/

logging:
  level:
    root: WARN
    com.ecommerce.payment: INFO