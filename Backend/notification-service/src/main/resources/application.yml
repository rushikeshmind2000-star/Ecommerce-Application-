spring:
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Rushee@2002
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ecommerce.notificationservice.event"
        spring.json.value.default.type: com.ecommerce.notificationservice.event.PaymentCompletedEvent
        spring.json.use.type.headers: false

eureka:
  client:
    enabled: false

logging:
  level:
    root: ERROR
    kafka: ERROR
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR